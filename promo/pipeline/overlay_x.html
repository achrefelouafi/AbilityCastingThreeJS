<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: #fff; position: relative; }

  /* ---------- header ---------- */
  #hdr {
    position: absolute; left: 0; top: 0; width: 1920px; height: 116px; overflow: hidden;
    background:
      radial-gradient(60% 220% at 50% -60%, rgba(80, 120, 255, .25), transparent 70%),
      linear-gradient(180deg, #0b1020 0%, #060912 100%);
  }
  #hdr .grid {
    position: absolute; inset: 0; opacity: .12;
    background-image:
      linear-gradient(rgba(140,170,255,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,170,255,.5) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .left { position: absolute; left: 40px; top: 0; height: 111px; display: flex; align-items: center; gap: 22px; }
  .three { display: flex; align-items: center; gap: 14px; }
  .three svg { width: 56px; height: 56px; }
  .three .word { font-weight: 800; font-size: 42px; letter-spacing: -1px; }
  .three .word b { font-weight: 800; color: #9fb6ff; }
  .sep { width: 2px; height: 46px; background: rgba(255,255,255,.18); }
  .pill {
    display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 25px;
    font-weight: 800; font-size: 23px; letter-spacing: 2.5px;
    background: rgba(46, 230, 140, .14); border: 2px solid rgba(70, 255, 160, .75); color: #7dffbd;
  }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #5dffad; box-shadow: 0 0 12px #5dffad; }

  .right { position: absolute; right: 40px; top: 0; height: 111px; display: flex; align-items: center; gap: 18px; }
  .lead { font-weight: 600; font-size: 25px; color: rgba(255,255,255,.72); white-space: nowrap; }
  .lead b { color: #fff; font-weight: 800; }
  .site {
    position: relative; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px 0 16px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(90deg, rgba(110,150,255,.18), rgba(170,120,255,.18)); border: 2px solid rgba(160,180,255,.55);
    font-family: 'JetBrains Mono', monospace; font-size: 25px; font-weight: 700; white-space: nowrap;
  }
  .site svg { width: 32px; height: 32px; flex: none; }
  .site .shine { position: absolute; top: -20px; bottom: -20px; width: 90px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform: skewX(-20deg); }

  .bar { position: absolute; left: 0; top: 111px; height: 5px; width: 1920px; background: rgba(255,255,255,.06); }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); box-shadow: 0 0 14px var(--a2); }

  /* ---------- columns ---------- */
  .gap { position: absolute; top: 116px; width: 6px; height: 964px; background: #05070d; }
  .col { position: absolute; top: 116px; width: 636px; height: 964px; }
  .frame { position: absolute; inset: 0; border: 2px solid var(--acc); opacity: .5; box-shadow: inset 0 0 50px -12px var(--acc); }
  .corner { position: absolute; width: 34px; height: 34px; border-color: var(--acc); border-style: solid; filter: drop-shadow(0 0 6px var(--acc)); }
  .corner.tl { left: 12px; top: 12px; border-width: 4px 0 0 4px; }
  .corner.tr { right: 12px; top: 12px; border-width: 4px 4px 0 0; }
  .corner.bl { left: 12px; bottom: 12px; border-width: 0 0 4px 4px; }
  .corner.br { right: 12px; bottom: 12px; border-width: 0 4px 4px 0; }
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 170px; background: linear-gradient(180deg, rgba(0,0,0,.6), transparent); }
  .label { position: absolute; left: 30px; top: 30px; display: flex; align-items: stretch; gap: 14px; }
  .stripe { width: 6px; border-radius: 3px; background: var(--acc); box-shadow: 0 0 14px var(--acc); }
  .meta { display: flex; flex-direction: column; gap: 8px; }
  .name { font-weight: 900; font-size: 38px; letter-spacing: -.5px; line-height: 1; white-space: nowrap; text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); }
  .tag { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px; letter-spacing: 2px; color: var(--acc); text-shadow: 0 1px 8px rgba(0,0,0,.95); }
  .key { display: inline-grid; place-items: center; min-width: 30px; height: 28px; padding: 0 7px; border-radius: 7px; border: 2px solid var(--acc); color: #fff; font-size: 16px; background: rgba(0,0,0,.45); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

  /* The banner is static: identical on every frame of every video, so cuts between videos never show it. */
  .pill { box-shadow: 0 0 19px rgba(70,255,160,.42); }
  .three svg { filter: drop-shadow(0 0 13px rgba(170,195,255,.6)); }
  .site { box-shadow: 0 0 18px rgba(150,170,255,.35); }
  .bar i, .site .shine { display: none; }
</style>
</head>
<body>
  <div id="hdr">
    <div class="grid"></div>
    <div class="left">
      <div class="three">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M.38 0a.268.268 0 0 0-.256.332l2.894 11.716a.268.268 0 0 0 .01.04l2.89 11.708a.268.268 0 0 0 .447.128L23.802 7.15a.268.268 0 0 0-.112-.45l-5.784-1.667a.268.268 0 0 0-.123-.035L6.38 1.715a.268.268 0 0 0-.144-.04L.456.01A.268.268 0 0 0 .38 0zm.374.654L5.71 2.08 1.99 5.664zM6.61 2.34l4.864 1.4-3.65 3.515zm-.522.12l1.217 4.926-4.877-1.4zm6.28 1.538l4.878 1.404-3.662 3.53zm-.52.13l1.208 4.9-4.853-1.392zm6.3 1.534l4.947 1.424-3.715 3.574zm-.524.12l1.215 4.926-4.876-1.398zm-15.432.696l4.964 1.424-3.726 3.586zM8.047 8.15l4.877 1.4-3.66 3.527zm-.518.137l1.236 5.017-4.963-1.432zm6.274 1.535l4.965 1.425-3.73 3.586zm-.52.127l1.235 5.012-4.958-1.43zm-9.63 2.438l4.873 1.406-3.656 3.523zm5.854 1.687l4.863 1.403-3.648 3.51zm-.54.04l1.214 4.927-4.875-1.4zm-3.896 4.02l5.037 1.442-3.782 3.638z"/></svg>
        <div class="word">three<b>.js</b></div>
      </div>
      <div class="sep"></div>
      <div class="pill"><i></i>OPEN SOURCE</div>
    </div>
    <div class="right">
      <div class="lead"><b>Open-source project</b> · get the link at</div>
      <div class="site" id="site">
        <svg viewBox="0 0 24 24" fill="none" stroke="#cfd9ff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.8 4 6 4 9.5s-1.2 6.7-4 9.5M12 2.5c-2.8 2.8-4 6-4 9.5s1.2 6.7 4 9.5"/></svg>
        <span>abilitycastingthreejs.chirovisuals.xyz</span>
        <div class="shine" id="shine"></div>
      </div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="cols"></div>

<script>
const HDR = 116, CW = 636, GAP = 6;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const backOut = (t) => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let cfg = null, els = {};

function init(c) {
  cfg = c;
  c.panels.forEach((p, i) => document.documentElement.style.setProperty(`--a${i + 1}`, p.accent));
  const root = document.getElementById('cols');
  els.cols = c.panels.map((p, i) => {
    const x = i * (CW + GAP);
    if (i > 0) {
      const g = document.createElement('div');
      g.className = 'gap'; g.style.left = (x - GAP) + 'px';
      root.appendChild(g);
    }
    const el = document.createElement('div');
    el.className = 'col';
    el.style.left = x + 'px';
    el.style.setProperty('--acc', p.accent);
    el.innerHTML = `
      <div class="scrim"></div>
      <div class="frame"></div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="label">
        <div class="stripe"></div>
        <div class="meta">
          <div class="name">${p.name}</div>
          <div class="tag"><span class="key">${p.key}</span>${p.tag}</div>
        </div>
      </div>
`;
    root.appendChild(el);
    return {
      label: el.querySelector('.label'),
      stripe: el.querySelector('.stripe'),
      frame: el.querySelector('.frame'),
      corners: [...el.querySelectorAll('.corner')]
    };
  });
  els.left = document.querySelector('.left');
  els.pill = document.querySelector('.pill');
  els.logo = document.querySelector('.three svg');
  els.lead = document.querySelector('.lead');
  els.site = document.getElementById('site');
  els.shine = document.getElementById('shine');
  els.bar = document.getElementById('bar');
}

/** Pure function of time: every frame is reproducible. */
function render(t) {
  const D = cfg.duration;




  els.cols.forEach((p, i) => {
    const d = 0.05 + i * 0.09;
    const k = easeOut((t - d) / 0.4);
    p.label.style.opacity = k;
    p.label.style.transform = `translateY(${(1 - k) * -30}px)`;
    p.stripe.style.transform = `scaleY(${backOut((t - d) / 0.4)})`;
    const ck = easeOut((t - d) / 0.35);
    const off = (1 - ck) * 40;
    p.corners[0].style.transform = `translate(${-off}px,${-off}px)`;
    p.corners[1].style.transform = `translate(${off}px,${-off}px)`;
    p.corners[2].style.transform = `translate(${-off}px,${off}px)`;
    p.corners[3].style.transform = `translate(${off}px,${off}px)`;
    p.corners.forEach((c) => (c.style.opacity = ck));
    p.frame.style.opacity = (0.35 + 0.25 * (0.5 + 0.5 * Math.sin(t * 4 + i * 2))) * ck;
  });
}
window.init = init;
window.render = render;
</script>
</body>
</html>
