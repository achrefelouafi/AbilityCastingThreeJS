<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: #fff; position: relative; }

  /* ---------- header (same as the split videos) ---------- */
  #hdr {
    position: absolute; left: 0; top: 0; width: 1920px; height: 116px; overflow: hidden;
    background:
      radial-gradient(60% 220% at 50% -60%, rgba(80, 120, 255, .25), transparent 70%),
      linear-gradient(180deg, #0b1020 0%, #060912 100%);
  }
  #hdr .grid { position: absolute; inset: 0; opacity: .12;
    background-image: linear-gradient(rgba(140,170,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(140,170,255,.5) 1px, transparent 1px);
    background-size: 40px 40px; }
  .left { position: absolute; left: 40px; top: 0; height: 111px; display: flex; align-items: center; gap: 22px; }
  .three { display: flex; align-items: center; gap: 14px; }
  .three svg { width: 56px; height: 56px; }
  .three .word { font-weight: 800; font-size: 42px; letter-spacing: -1px; }
  .three .word b { font-weight: 800; color: #9fb6ff; }
  .sep { width: 2px; height: 46px; background: rgba(255,255,255,.18); }
  .pill { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 25px; font-weight: 800; font-size: 23px; letter-spacing: 2.5px;
    background: rgba(46, 230, 140, .14); border: 2px solid rgba(70, 255, 160, .75); color: #7dffbd; }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #5dffad; box-shadow: 0 0 12px #5dffad; }
  .right { position: absolute; right: 40px; top: 0; height: 111px; display: flex; align-items: center; gap: 18px; }
  .lead { font-weight: 600; font-size: 25px; color: rgba(255,255,255,.72); white-space: nowrap; }
  .lead b { color: #fff; font-weight: 800; }
  .site { position: relative; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px 0 16px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(90deg, rgba(110,150,255,.18), rgba(170,120,255,.18)); border: 2px solid rgba(160,180,255,.55);
    font-family: 'JetBrains Mono', monospace; font-size: 25px; font-weight: 700; white-space: nowrap; }
  .site svg { width: 32px; height: 32px; flex: none; }
  .site .shine { position: absolute; top: -20px; bottom: -20px; width: 90px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform: skewX(-20deg); }
  .bar { position: absolute; left: 0; top: 111px; height: 5px; width: 1920px; background: rgba(255,255,255,.06); }
  .bar i { display: block; height: 100%; width: 0; background: var(--acc); box-shadow: 0 0 14px var(--acc); }

  /* ---------- viewport furniture ---------- */
  #view { position: absolute; left: 0; top: 116px; width: 1920px; height: 964px; overflow: hidden; }
  .corner { position: absolute; width: 40px; height: 40px; border-color: var(--acc); border-style: solid; opacity: .85; filter: drop-shadow(0 0 6px var(--acc)); }
  .corner.tl { left: 16px; top: 16px; border-width: 4px 0 0 4px; }
  .corner.tr { right: 16px; top: 16px; border-width: 4px 4px 0 0; }
  .corner.bl { left: 16px; bottom: 16px; border-width: 0 0 4px 4px; }
  .corner.br { right: 16px; bottom: 16px; border-width: 0 4px 4px 0; }
  .scrimB { position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: linear-gradient(0deg, rgba(0,0,0,.65), transparent); }
  .scrimR { position: absolute; top: 0; right: 0; bottom: 0; width: 820px; background: linear-gradient(270deg, rgba(3,5,12,.72) 30%, transparent); opacity: 0; }
  .edge { position: absolute; inset: 0; border: 3px solid var(--acc); opacity: 0; box-shadow: inset 0 0 120px -20px var(--acc); }

  .title { position: absolute; left: 56px; bottom: 54px; }
  .title .name { font-weight: 900; font-size: 80px; letter-spacing: -2px; line-height: 1; text-shadow: 0 4px 30px rgba(0,0,0,.8); }
  .title .tag { margin-top: 14px; display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; letter-spacing: 3px; color: var(--acc); text-shadow: 0 1px 10px rgba(0,0,0,.95); }
  .key { display: inline-grid; place-items: center; min-width: 40px; height: 38px; padding: 0 9px; border-radius: 9px; border: 2px solid var(--acc); color: #fff; font-size: 22px; background: rgba(0,0,0,.5); letter-spacing: 0; }

  .status { position: absolute; left: 56px; top: 44px; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 18px; border-radius: 26px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 21px; letter-spacing: 2px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.2); white-space: nowrap; }
  .status .ic { width: 18px; height: 18px; display: grid; place-items: center; }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: #ff3b4e; box-shadow: 0 0 12px #ff3b4e; }
  .status .pz { display: flex; gap: 4px; } .status .pz i { width: 6px; height: 18px; background: var(--acc); border-radius: 2px; }
  .status .pl { width: 0; height: 0; border-left: 16px solid #5dffad; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }

  /* ---------- the editor panel ---------- */
  .panel { position: absolute; right: 48px; top: 52px; width: 560px; padding: 26px 28px 24px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(18,22,36,.92), rgba(10,13,22,.92)); border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08); }
  .ph { display: flex; align-items: center; gap: 12px; }
  .ph svg { width: 26px; height: 26px; }
  .ph .t { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 19px; letter-spacing: 3px; color: rgba(255,255,255,.6); }
  .ph .live { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 2px; padding: 5px 10px; border-radius: 8px; color: var(--acc); border: 1.5px solid var(--acc); }
  .pt { margin-top: 10px; font-weight: 800; font-size: 32px; letter-spacing: -.5px; }
  .rows { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .row { position: relative; padding: 14px 16px 18px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1.5px solid transparent; }
  .crumb { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; color: rgba(255,255,255,.42); text-transform: uppercase; }
  .lab { margin-top: 4px; display: flex; align-items: baseline; justify-content: space-between; }
  .lab .l { font-weight: 700; font-size: 23px; }
  .lab .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; padding: 3px 10px; border-radius: 8px; background: rgba(0,0,0,.45); border: 1.5px solid rgba(255,255,255,.14); min-width: 92px; text-align: right; }
  .track { position: relative; margin-top: 14px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--acc); box-shadow: 0 0 12px var(--acc); }
  .knob { position: absolute; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px var(--acc), 0 4px 12px rgba(0,0,0,.6); }
  .sw { margin-top: 12px; display: flex; gap: 8px; }
  .sw i { flex: 1; height: 34px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.2); }
  .hue { position: relative; margin-top: 14px; height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .foot { margin-top: 16px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,.45); display: flex; align-items: center; gap: 8px; }

  .cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; transform-origin: 4px 3px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.7)); }

  /* The banner is static: identical on every frame of every video, so cuts between videos never show it. */
  .pill { box-shadow: 0 0 19px rgba(70,255,160,.42); }
  .three svg { filter: drop-shadow(0 0 13px rgba(170,195,255,.6)); }
  .site { box-shadow: 0 0 18px rgba(150,170,255,.35); }
  .bar i, .site .shine { display: none; }
</style>
</head>
<body>
  <div id="hdr">
    <div class="grid"></div>
    <div class="left">
      <div class="three">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M.38 0a.268.268 0 0 0-.256.332l2.894 11.716a.268.268 0 0 0 .01.04l2.89 11.708a.268.268 0 0 0 .447.128L23.802 7.150a.268.268 0 0 0-.112-.45l-5.784-1.667a.268.268 0 0 0-.123-.035L6.38 1.715a.268.268 0 0 0-.144-.04L.456.01A.268.268 0 0 0 .38 0zm.374.654L5.71 2.08 1.99 5.664zM6.61 2.34l4.864 1.4-3.65 3.515zm-.522.12l1.217 4.926-4.877-1.4zm6.28 1.538l4.878 1.404-3.662 3.53zm-.52.13l1.208 4.9-4.853-1.392zm6.3 1.534l4.947 1.424-3.715 3.574zm-.524.12l1.215 4.926-4.876-1.398zm-15.432.696l4.964 1.424-3.726 3.586zM8.047 8.15l4.877 1.4-3.66 3.527zm-.518.137l1.236 5.017-4.963-1.432zm6.274 1.535l4.965 1.425-3.73 3.586zm-.52.127l1.235 5.012-4.958-1.43zm-9.63 2.438l4.873 1.406-3.656 3.523zm5.854 1.687l4.863 1.403-3.648 3.51zm-.54.04l1.214 4.927-4.875-1.4zm-3.896 4.02l5.037 1.442-3.782 3.638z"/></svg>
        <div class="word">three<b>.js</b></div>
      </div>
      <div class="sep"></div>
      <div class="pill"><i></i>OPEN SOURCE</div>
    </div>
    <div class="right">
      <div class="lead"><b>Open-source project</b> · get the link at</div>
      <div class="site" id="site">
        <svg viewBox="0 0 24 24" fill="none" stroke="#cfd9ff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.8 4 6 4 9.5s-1.2 6.7-4 9.5M12 2.5c-2.8 2.8-4 6-4 9.5s1.2 6.7 4 9.5"/></svg>
        <span>abilitycastingthreejs.chirovisuals.xyz</span>
        <div class="shine" id="shine"></div>
      </div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div id="view">
    <div class="scrimB"></div>
    <div class="scrimR" id="scrimR"></div>
    <div class="edge" id="edge"></div>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="status" id="status"></div>
    <div class="title" id="title"><div class="name" id="name"></div><div class="tag" id="tag"></div></div>

    <div class="panel" id="panel">
      <div class="ph">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <div class="t">VFX EDITOR</div>
        <div class="live" id="plive">LIVE PREVIEW</div>
      </div>
      <div class="pt" id="pt"></div>
      <div class="rows" id="rows"></div>
      <div class="foot">Edits apply to the frozen frame, instantly</div>
    </div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M3 2l15 11.5-6.6.9 3.9 7.4-3 1.5-3.9-7.5L3 20z" fill="#fff" stroke="#0a0d16" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>

<script>
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const backOut = (t) => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let C = null, E = {};

function decimals(step) { if (!step || step >= 1) return 0; return Math.min(3, Math.ceil(-Math.log10(step) - 1e-9)); }

function init(cfg) {
  C = cfg;
  document.documentElement.style.setProperty('--acc', cfg.accent);
  document.getElementById('name').textContent = cfg.name;
  document.getElementById('tag').innerHTML = `${cfg.tag}<span style="opacity:.5">·</span>PRESS <span class="key">${cfg.key}</span>`;
  document.getElementById('pt').textContent = cfg.name;
  const rows = document.getElementById('rows');
  E.rows = cfg.meta.rows.map((r) => {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<div class="crumb">${(r.path || 'The cast').replace(/\//g, '›')}</div>
      <div class="lab"><span class="l">${r.label}</span><span class="v"></span></div>
      <div class="track"><div class="fill"></div><div class="knob"></div></div>`;
    rows.appendChild(el);
    return { el, v: el.querySelector('.v'), fill: el.querySelector('.fill'), knob: el.querySelector('.knob'), r };
  });
  const pr = document.createElement('div');
  pr.className = 'row';
  const n = cfg.meta.palette.length;
  pr.innerHTML = `<div class="crumb">The palette · ${n} colours</div>
    <div class="lab"><span class="l">colours</span><span class="v"></span></div>
    <div class="sw">${'<i></i>'.repeat(6)}</div>
    <div class="hue"><div class="knob"></div></div>`;
  rows.appendChild(pr);
  E.pal = { el: pr, v: pr.querySelector('.v'), sw: [...pr.querySelectorAll('.sw i')], knob: pr.querySelector('.hue .knob'), bar: pr.querySelector('.hue') };
  E.panel = document.getElementById('panel');
  E.scrimR = document.getElementById('scrimR');
  E.edge = document.getElementById('edge');
  E.status = document.getElementById('status');
  E.title = document.getElementById('title');
  E.cursor = document.getElementById('cursor');
  E.bar = document.getElementById('bar');
  E.shine = document.getElementById('shine');
  E.left = document.querySelector('.left'); E.lead = document.querySelector('.lead'); E.site = document.getElementById('site');
  E.pill = document.querySelector('.pill'); E.logo = document.querySelector('.three svg');
  E.lastStatus = '';
}

function setStatus(kind) {
  if (kind === E.lastStatus) return;
  E.lastStatus = kind;
  const s = E.status;
  if (kind === 'live') { s.innerHTML = '<span class="ic"><span class="dot"></span></span>REAL-TIME · IN THE BROWSER'; s.style.borderColor = 'rgba(255,255,255,.2)'; }
  if (kind === 'paused') { s.innerHTML = '<span class="ic pz"><i></i><i></i></span>PAUSED · TWEAKING LIVE'; s.style.borderColor = C.accent; }
  if (kind === 'resumed') { s.innerHTML = '<span class="ic"><span class="pl"></span></span>RESUMED · NEW SETTINGS'; s.style.borderColor = '#5dffad'; }
}

function knobCenter(knob) {
  const b = knob.getBoundingClientRect();
  return [b.left + b.width / 2, b.top + b.height / 2 - 116];
}

function render(f) {
  const fr = C.frames[f];
  const P = C.pause, L = C.pauseLen;
  const t = f / 60;
  const N = C.frames.length;

  // header

  // title card
  const tk = easeOut((t - 0.15) / 0.5);
  E.title.style.opacity = tk; E.title.style.transform = `translateY(${(1 - tk) * 30}px)`;

  // status chip
  setStatus(f < P ? 'live' : f < P + L ? 'paused' : f < P + L + 100 ? 'resumed' : 'live');
  const flip = (a) => Math.pow(clamp(1 - (f - a) / 14), 2);
  const pop = Math.max(f >= P ? flip(P) : 0, f >= P + L ? flip(P + L) : 0, flip(0));
  E.status.style.transform = `scale(${1 + 0.12 * pop})`;
  E.status.style.opacity = easeOut((t - 0.1) / 0.3);

  // edge pulse on pause / resume, held faintly while paused
  E.edge.style.opacity = Math.max(fr.paused ? 0.35 : 0, f >= P ? flip(P) : 0, f >= P + L ? flip(P + L) * 0.8 : 0);

  // panel
  const k = fr.panel;
  E.panel.style.opacity = clamp(k * 1.4);
  E.panel.style.transform = `translateX(${(1 - k) * 640}px)`;
  E.scrimR.style.opacity = k;

  E.rows.forEach((row, i) => {
    const r = row.r, v = fr.vals[i];
    const u = clamp((v - r.min) / (r.max - r.min));
    row.fill.style.width = (u * 100) + '%';
    row.knob.style.left = (u * 100) + '%';
    row.v.textContent = v.toFixed(decimals(r.step));
  });
  const hu = clamp(fr.hue / 360);
  E.pal.knob.style.left = (hu * 100) + '%';
  E.pal.v.textContent = (fr.hue > 0.5 ? '+' : '') + Math.round(fr.hue) + '° hue';
  E.pal.sw.forEach((s, i) => (s.style.background = fr.swatches[i % fr.swatches.length]));

  // which row is in hand
  const drag = [[P + 26, P + 76], [P + 84, P + 134], [P + 142, P + 192]];
  const active = drag.findIndex(([a, b]) => f >= a - 4 && f <= b + 4);
  [...E.rows.map((r) => r.el), E.pal.el].forEach((el, i) => {
    el.style.background = i === active ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.035)';
    el.style.borderColor = i === active ? C.accent : 'transparent';
  });

  // cursor: in from the right, onto each knob, drag, away
  const knobs = [...E.rows.map((r) => r.knob), E.pal.knob];
  const off1 = [1990, 640], off2 = [1990, 900];
  let pos = null, pressed = false;
  const lerp2 = (a, b, s) => [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s];
  if (f >= P + 6 && f < P + L + 30) {
    const kc = knobs.map(knobCenter);
    if (f < drag[0][0]) pos = lerp2(off1, kc[0], smooth((f - (P + 6)) / (drag[0][0] - P - 6)));
    else if (f <= drag[0][1]) { pos = kc[0]; pressed = true; }
    else if (f < drag[1][0]) pos = lerp2(kc[0], kc[1], smooth((f - drag[0][1]) / (drag[1][0] - drag[0][1])));
    else if (f <= drag[1][1]) { pos = kc[1]; pressed = true; }
    else if (f < drag[2][0]) pos = lerp2(kc[1], kc[2], smooth((f - drag[1][1]) / (drag[2][0] - drag[1][1])));
    else if (f <= drag[2][1]) { pos = kc[2]; pressed = true; }
    else pos = lerp2(kc[2], off2, smooth((f - drag[2][1]) / 30));
  }
  if (pos) {
    E.cursor.style.display = 'block';
    E.cursor.style.transform = `translate(${pos[0] - 4}px, ${pos[1] - 3}px) scale(${pressed ? 0.88 : 1})`;
  } else E.cursor.style.display = 'none';
}
window.init = init;
window.render = render;
</script>
</body>
</html>
